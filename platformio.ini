; ink-health-watch: PlatformIO configuration
;
; Two environments:
;   esp32s3  firmware for the Waveshare ESP32-S3-ePaper-1.54 board
;   native   host unit tests for the hardware-free libraries (run in CI)
;
; Board settings follow Waveshare's Arduino "Tools Configuration" for the
; V2 board (sold since 1 Nov 2025): ESP32-S3, QIO flash, OPI PSRAM,
; Huge APP partition, USB CDC on boot.

[platformio]
default_envs = esp32s3

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -Wall
    -Wextra
